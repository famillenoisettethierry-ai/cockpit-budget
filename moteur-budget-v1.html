<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit Budget Hebdo</title>
<style>
:root {
  --bg:#0A0912; --card:#15121F; --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
  --text:#F3F1F8; --text2:#9B95AC; --text3:#635D77; --text4:#453F5C;
  --green:#5EEAD4; --gold:#F0C674; --gray:#7C7593; --blue:#9E8CF6; --pink:#F472B6; --red:#FB7185;
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(158,140,246,.4) 0%, transparent 30%),
    radial-gradient(circle at 88% 28%, rgba(244,114,182,.32) 0%, transparent 28%),
    radial-gradient(circle at 15% 52%, rgba(94,234,212,.16) 0%, transparent 26%),
    radial-gradient(circle at 85% 70%, rgba(158,140,246,.3) 0%, transparent 30%),
    radial-gradient(circle at 20% 92%, rgba(244,114,182,.24) 0%, transparent 28%),
    #0A0912;
  background-attachment: fixed;
  color: var(--text); margin: 0; padding: 22px 16px 60px; max-width: 440px; margin-inline: auto;
  -webkit-font-smoothing: antialiased;
}
#app { opacity: 0; transition: opacity .4s; } #app.mounted { opacity: 1; }
.row { background: rgba(255,255,255,.04); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); border: 1px solid var(--border); border-radius: 28px; padding: 18px 20px; margin-bottom: 10px; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset; }
.section-title { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin: 26px 6px 10px; }
.section-title:first-of-type { margin-top: 0; }
.tabular { font-variant-numeric: tabular-nums; }
.head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.badge { color: var(--text3); font-size: 10px; font-weight: 600; letter-spacing: .4px; }
.hero-block { background: rgba(255,255,255,.045); backdrop-filter: blur(32px) saturate(160%); -webkit-backdrop-filter: blur(32px) saturate(160%); border: 1px solid var(--border); border-radius: 32px; padding: 26px 22px; position: relative; overflow: hidden; }
.hero-block::before { content:''; position:absolute; top:-70%; left:50%; transform:translateX(-50%); width:320px; height:320px; background:conic-gradient(from 180deg,var(--blue),var(--pink),var(--blue)); filter:blur(80px); opacity:.28; border-radius:50%; }
.hero-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; position:relative; font-weight: 500; }
.hero-amount { font-size: 46px; font-weight: 600; letter-spacing: -1.4px; line-height: 1; position:relative; }
.hero-sub { font-size: 11px; color: var(--text3); margin-top: 8px; position:relative; }
.banner { border-radius: 26px; padding: 20px; margin-bottom: 22px; }
.banner.warn { background: rgba(251,113,133,.06); border: 1px solid rgba(251,113,133,.18); }
.banner-title { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12.5px; font-weight: 600; color: var(--red); }
.banner-body { font-size: 12px; color: #C4BFD4; line-height: 1.55; margin-bottom: 10px; }
.banner-alt { font-size: 12px; color: var(--text2); background: rgba(255,255,255,.04); border-radius: 16px; padding: 10px 12px; }
.cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 26px; }
.card3 { background: rgba(255,255,255,.04); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 20px; padding: 13px 11px; }
.card3-name { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 10px; color: var(--text2); font-weight: 500; }
.dot { width: 6px; height: 6px; border-radius: 3px; }
.card3-amt { font-size: 19px; font-weight: 600; }
.card3-delta { font-size: 10.5px; margin-top: 2px; }
.lgauge-track { height: 5px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; width: 100%; }
.lgauge-fill { height: 100%; border-radius: 3px; transition: width .6s; }
.tx { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.tx-row { display: flex; justify-content: space-between; font-size: 11.5px; padding: 3px 0; color: var(--text2); }
.tx-empty { font-size: 11px; color: var(--text4); margin-top: 8px; }
.pole-head { display: flex; justify-content: space-between; margin-bottom: 10px; }
.pole-name { font-size: 14px; font-weight: 500; }
.pole-amt { font-size: 15px; font-weight: 500; }
.pole-amt small { font-size: 11px; color: var(--text3); font-weight: 400; }
.tag-adj { font-size: 9.5px; color: var(--pink); background: rgba(244,114,182,.12); border-radius: 20px; padding: 1.5px 8px; margin-left: 6px; font-weight: 500; }
.mois-note { font-size: 11px; color: var(--text3); margin-bottom: 8px; }
.pole-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; }
.banner-mini { display: flex; gap: 8px; border-radius: 18px; padding: 10px 12px; margin-top: 10px; font-size: 12px; }
.banner-mini.good { background: rgba(94,234,212,.08); border: 1px solid rgba(94,234,212,.18); color: #B8EEE4; }
.banner-mini.bad { background: rgba(251,113,133,.06); border: 1px solid rgba(251,113,133,.16); color: #F0C4CA; }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 14px 12px 6px; margin-bottom: 8px; }
.info-box { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 18px; padding: 12px 14px; margin-top: 8px; font-size: 12px; color: var(--text2); display: flex; gap: 8px; }
svg text { font-family: inherit; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = **DATA_PLACEHOLDER**;

const fmt = (n) => (n === null || n === undefined || Number.isNaN(Number(n))) ? "—" : Math.round(Number(n)).toLocaleString("fr-FR");
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- icônes SVG minimales (pas de dépendance npm) ----
const ICONS = {
  alert: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  sparkles: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M5 3v4M3 5h4M19 17v4M17 19h4"/></svg>`,
  info: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  chevron: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A414C" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>`,
  cart: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.2 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/></svg>`,
  ticket: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8z"/><path d="M13 6v2.2M13 10.9v2.2M13 15.8v2.2"/></svg>`,
  grid: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
  fuel: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 10h10"/><path d="M13 7.2l3.3 3.3"/><path d="M18 12.3v5.7a1.5 1.5 0 0 0 3 0V9.3L18.5 6.5"/></svg>`,
  heart: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.5-9C.8 7.4 2.6 4 6 4c2 0 3.4 1.1 4 2.2C10.6 5.1 12 4 14 4c3.4 0 5.2 3.4 3.5 7-2.5 4.6-9.5 9-9.5 9z"/></svg>`,
  piggy: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.2a6 6 0 0 1 6-5.7h3.3a5.5 5.5 0 0 1 5 3.1l.2.4H20a1 1 0 0 1 1 1v1.6a1 1 0 0 1-1 1h-1.5l-.6 1.5A5.4 5.4 0 0 1 13 18h-1v2H9v-2H8a4 4 0 0 1-4-4v-1.8z"/><circle cx="15.2" cy="9.8" r=".6" fill="currentColor" stroke="none"/></svg>`,
};
const POLE_ICON = { courses: ICONS.cart, loisirs: ICONS.ticket, autres: ICONS.grid, essence: ICONS.fuel, alenya: ICONS.heart };
function poleIcon(key, color, size = 16) {
  const svg = POLE_ICON[key] || ICONS.grid;
  return `<span style="color:${color};display:inline-flex;flex-shrink:0" >${svg.replace(/width="16" height="16"/, `width="${size}" height="${size}"`)}</span>`;
}

// ---- jauge circulaire SVG ----
function ring(pct, color, size = 44, stroke = 4) {
  pct = Math.max(0, Math.min(100, pct || 0));
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c - (pct / 100) * c;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg);flex-shrink:0">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#20262E" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}

// ---- jauge linéaire ----
function lgauge(pct, color) {
  pct = Math.max(0, Math.min(100, pct || 0));
  return `<div class="lgauge-track"><div class="lgauge-fill" style="width:${pct}%;background:${color}"></div></div>`;
}

// ---- mini courbe SVG (aire + points + labels valeurs), pas de dépendance npm ----
function areaChart(points, color, width = 400, height = 80) {
  const vals = points.map(p => p.montant).filter(v => v != null);
  if (vals.length === 0) return `<div style="height:${height}px;display:flex;align-items:center;justify-content:center;color:#3A414C;font-size:11px">Aucune donnée</div>`;
  const max = Math.max(...vals, 1), min = 0;
  const padTop = 20, padBottom = 6, padX = 10;
  const innerH = height - padTop - padBottom;
  const step = points.length > 1 ? (width - padX * 2) / (points.length - 1) : 0;
  const coords = points.map((p, i) => {
    const x = padX + i * step;
    const y = p.montant == null ? null : padTop + innerH - ((p.montant - min) / (max - min || 1)) * innerH;
    return { x, y, v: p.montant };
  });
  const valid = coords.filter(c => c.y != null);
  let path = "", area = "";
  if (valid.length > 1) {
    path = "M" + valid.map(c => `${c.x},${c.y}`).join(" L");
    area = path + ` L${valid[valid.length-1].x},${height-padBottom} L${valid[0].x},${height-padBottom} Z`;
  }
  const gradId = "grad" + Math.round(Math.random()*1e6);
  const dots = valid.map(c => `
    <circle cx="${c.x}" cy="${c.y}" r="2.6" fill="${color}" stroke="#0B0E11" stroke-width="1.2"/>
    <text x="${c.x}" y="${c.y - 8}" text-anchor="middle" font-size="9" font-weight="500" fill="#8B92A0">${Math.round(c.v)}</text>
  `).join("");
  return `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${valid.length > 1 ? `<path d="${area}" fill="url(#${gradId})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>` : ""}
    ${dots}
  </svg>`;
}

function txList(txs) {
  if (!txs || txs.length === 0) return `<div class="tx-empty">Aucune transaction sur cette période.</div>`;
  return `<div class="tx">${txs.map(t => `
    <div class="tx-row"><span>${esc(t.m)} <span style="color:#3A414C">· ${esc(t.d)}</span>${t.n ? ` <span style="color:#8A93A3">· ${esc(t.n)}</span>` : ''}</span><span class="tabular">${t.v.toFixed(2)} €</span></div>
  `).join("")}</div>`;
}

function bravoBanner(pole) {
  if (pole.contraint || !pole.bravo || !pole.bravo.actif) return "";
  return `<div class="banner-mini good">${ICONS.sparkles}<span><strong style="color:var(--green)">Bravo</strong> : ${esc(pole.bravo.texte)}</span></div>`;
}
function absorptionBanner(pole) {
  if (pole.absorbe) return `<div class="banner-mini bad">${ICONS.alert}<span>-${fmt(pole.absorbe)} € absorbés suite au dépassement du pôle Autres cette semaine.</span></div>`;
  if (pole.absorbe_ailleurs) return `<div class="banner-mini bad">${ICONS.alert}<span>Dépassement de ${fmt(pole.absorbe_ailleurs)} € absorbé sur Loisirs & sorties.</span></div>`;
  return "";
}

function breakevenBanner(b) {
  if (!b || !b.actif) return "";
  return `<div class="banner warn">
    <div class="banner-title">${ICONS.alert}<span>Mois tendu — budgets ajustés</span></div>
    <div class="banner-body">Disponible réel : ${fmt(b.disponible)} € pour ${fmt(b.besoin_plafond)} € de plafonds théoriques restants. Certains pôles sont réduits ci-dessous plutôt que de laisser croire à un budget qui n'existe pas.</div>
    <div class="banner-alt">Alternative : prélever <strong style="color:var(--text)">${fmt(b.montant_epargne_alternatif)} €</strong> de l'épargne existante pour garder tous les budgets à leur plafond normal ce mois-ci.</div>
  </div>`;
}

function fmt2(n){ return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function render() {
  const d = DATA;
  const budgetHebdoTotal = d.poles_hebdo.reduce((s, p) => s + p.budget_venir, 0);

  const html = `
    <div class="head">
      <div style="font-size:11px;color:var(--text3)">Bilan ${esc(d.meta.semaine_ecoulee_label)} · Budget ${esc(d.meta.semaine_a_venir_label)}</div>
      <span class="badge">DONNÉES RÉELLES</span>
    </div>

    <div class="hero-block" style="margin-bottom:16px">
      <div class="hero-label">Solde disponible</div>
      <div class="hero-amount tabular" style="font-size:40px;color:${d.solde_paliers.palier1 < 0 ? 'var(--red)' : 'var(--text)'}">
        ${fmt(d.solde_paliers.palier1)} <span style="font-size:21px;color:var(--text3);font-weight:500">€</span>
      </div>
      <div class="hero-sub">${fmt(d.solde_paliers.solde_actuel)} € au ${esc(d.solde_paliers.date_releve)} · +${fmt(d.solde_paliers.entrees_connues)} € attendus · -${fmt(d.solde_paliers.prelevements_restants)} € à venir</div>
      ${d.solde_paliers.entrees_label ? `<div style="font-size:10.5px;color:var(--text4);margin-top:4px;line-height:1.4">${esc(d.solde_paliers.entrees_label)}</div>` : ""}

      <div style="text-align:center;margin:14px 0 8px">
        <span style="font-size:10px;color:var(--text4)">− ${fmt(d.solde_paliers.budgets_pleins)} € si tout est financé plein</span>
      </div>

      <div class="hero-label">Si budgets pleins</div>
      <div class="hero-amount tabular" style="font-size:34px;color:var(--red)">
        ${fmt(d.solde_paliers.palier2)} <span style="font-size:18px;color:var(--text3);font-weight:500">€</span>
      </div>
    </div>

    ${d.solde_paliers.palier3 != null ? `<div style="border-radius:14px;border:1px solid ${d.solde_paliers.palier3 < 0 ? 'var(--red)' : 'var(--green)'};background:${d.solde_paliers.palier3 < 0 ? 'rgba(226,75,74,.08)' : 'rgba(29,158,117,.08)'};padding:16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:14px">
      <div class="hero-amount tabular" style="font-size:32px;color:${d.solde_paliers.palier3 < 0 ? 'var(--red)' : 'var(--green)'}">
        ${fmt(d.solde_paliers.palier3)} <span style="font-size:16px;color:var(--text3);font-weight:500">€</span>
      </div>
      <div style="font-size:12.5px;color:#B8BEC8;text-align:right;max-width:190px">
        ${d.solde_paliers.palier3 < 0
          ? `Découvert réel <strong style="color:var(--text)">malgré les budgets réduits</strong> aux planchers du cockpit`
          : `Aucun découvert prévu <strong style="color:var(--text)">si vous suivez les budgets du cockpit</strong>`}
      </div>
    </div>` : ""}

    ${(() => {
      const p = d.prelevements;
      if (!p) return "";
      const retard = p.en_retard || [], ecarts = p.ecarts_corriges || [], quest = p.a_trancher || [];
      if (!retard.length && !ecarts.length && !quest.length) return "";
      const line = (color, txt) => `<div style="font-size:12px;color:#B8BEC8;background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:6px;border-left:3px solid ${color}">${txt}</div>`;
      let html = `<div class="row" style="margin-bottom:22px"><div style="font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);margin-bottom:10px">Prélèvements du mois</div>`;
      if (retard.length) {
        html += line('var(--red)', `<strong style="color:var(--red)">${retard.length} en retard — ${fmt2(p.total_retard)} €</strong><br>` +
          retard.map(r => `${esc(r.charge)} · ${fmt2(r.montant)} € · prévu le ${esc(String(r.jour))}, non débité`).join("<br>"));
      }
      if (ecarts.length) {
        html += line('var(--gold)', `<strong style="color:var(--text)">Écarts corrigés automatiquement</strong><br>` +
          ecarts.map(e => `${esc(e.charge)} : ${fmt2(e.avant)} € → <strong style="color:var(--text)">${fmt2(e.apres)} €</strong>`).join("<br>"));
      }
      if (quest.length) {
        html += line('var(--blue)', `<strong style="color:var(--text)">À trancher</strong><br>` +
          quest.map(q => esc(q)).join("<br>"));
      }
      html += `<div style="font-size:11px;color:var(--text4);margin-top:8px">${esc(p.synthese)}</div></div>`;
      return html;
    })()}

    <div class="row" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
      ${ring(Math.round(d.epargne_mois.restant / d.epargne_mois.objectif * 100), d.epargne_mois.restant > 0 ? 'var(--green)' : 'var(--red)')}
      <div style="flex:1">
        <div style="font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px"><span style="color:var(--gold);display:inline-flex">${ICONS.piggy}</span>Épargne — objectif du mois</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">Sacrifiée en premier par la cascade</div>
      </div>
      <div style="font-size:16px;font-weight:500;color:${d.epargne_mois.restant > 0 ? 'var(--green)' : 'var(--red)'}" class="tabular">
        ${fmt(d.epargne_mois.restant)} € <span style="font-size:11px;color:var(--text3);font-weight:400">/ ${fmt(d.epargne_mois.objectif)} €</span>
      </div>
    </div>

    <div class="cards3">
      ${d.poles_hebdo.map(p => {
        const delta = p.budget_venir - p.base;
        const hasResteReel = p.spent_week != null;
        const resteReel = hasResteReel ? p.budget_venir - p.spent_week : null;
        return `<div class="card3">
          <div class="card3-name">${poleIcon(p.key, p.color, 14)}${esc(p.name)}</div>
          <div class="card3-amt tabular">${fmt(p.budget_venir)} €</div>
          ${delta !== 0 ? `<div class="card3-delta" style="color:${delta > 0 ? 'var(--green)' : 'var(--red)'}">${delta > 0 ? '+' : ''}${fmt(delta)} €</div>` : ""}
          ${hasResteReel ? `<div class="card3-delta tabular" style="color:${resteReel < 0 ? 'var(--red)' : 'var(--text3)'};margin-top:3px">${fmt(resteReel)} € reste réel</div>` : ""}
        </div>`;
      }).join("")}
    </div>

    <div class="section-title">Budgets mensuels — ${esc(d.meta.mois_label)}</div>
    ${d.poles_mensuels.map(p => {
      const pct = (p.spent_mois != null && p.cap) ? Math.round(p.spent_mois / p.cap * 100) : 0;
      const normalLeft = (p.cap != null && p.spent_mois != null) ? Math.max(0, p.cap - p.spent_mois) : null;
      const rr = Number(p.restant_reel);
      // Un plafond "ramené" par le breakeven ne peut que RÉDUIRE le reste normal, jamais l'augmenter.
      // Une valeur incohérente (>= reste normal, ou non numérique) est traitée comme non contrainte.
      const contraint = p.restant_reel != null && !Number.isNaN(rr) && normalLeft != null && rr < normalLeft;
      const left = contraint ? rr : normalLeft;
      return `<div class="row">
        <div style="display:flex;align-items:center;gap:12px">
          ${ring(pct, p.color)}
          <div style="flex:1;min-width:0">
            <div style="font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px">${poleIcon(p.key, p.color, 15)}${esc(p.name)}${contraint ? '<span class="tag-adj">ajusté</span>' : ''}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px" class="tabular">${fmt(p.spent_mois)} € / ${fmt(p.cap)} € · ${d.meta.jours_restants_mois}j restants</div>
            ${contraint ? `<div style="font-size:11px;color:var(--text3);margin-top:3px">plafond ramené à ${fmt(p.spent_mois + left)} € par le breakeven</div>` : ""}
          </div>
          <div style="font-size:16px;font-weight:500" class="tabular"${left < 0 ? ' style="color:var(--red)"' : ''}>${fmt(left)} €</div>
          ${ICONS.chevron}
        </div>
        ${txList(p.txs)}
      </div>`;
    }).join("")}

    <div class="section-title">Pôles hebdo — bilan ${esc(d.meta.semaine_ecoulee_label)} &amp; budget à venir</div>
    ${d.poles_hebdo.map(p => {
      const pctSemaine = (p.spent_last != null && p.base) ? Math.round(p.spent_last / p.base * 100) : 0;
      const over = p.spent_last > p.base;
      const pctMois = (p.spent_mois != null && p.cap_mensuel) ? Math.round(p.spent_mois / p.cap_mensuel * 100) : 0;
      const normalResteMois = Math.max(0, (Number(p.cap_mensuel) || 0) - (Number(p.spent_mois) || 0));
      const bkRestant = Number(p.breakeven_mensuel_restant);
      const bkValide = p.contraint && p.breakeven_mensuel_restant != null && !Number.isNaN(bkRestant) && bkRestant < normalResteMois;
      const resteMensuel = bkValide ? bkRestant : normalResteMois;
      return `<div class="row">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)">
          ${ring(pctMois, p.color, 36, 3.5)}
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;color:var(--text3)" class="tabular">${fmt(p.spent_mois)} € / ${fmt(p.cap_mensuel)} € ce mois${p.contraint ? ' · ajusté' : ''}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:18px;font-weight:600;${resteMensuel < 0 ? 'color:var(--red)' : ''}" class="tabular">${fmt(resteMensuel)} €</div>
            <div style="font-size:10.5px;color:var(--text3)">sur le mois</div>
          </div>
        </div>
        <div class="pole-head">
          <span class="pole-name" style="display:inline-flex;align-items:center;gap:7px">${poleIcon(p.key, p.color, 15)}${esc(p.name)}${p.contraint ? '<span class="tag-adj">ajusté</span>' : ''}</span>
          <span class="pole-amt tabular">${fmt(p.budget_venir)} € <small>à venir</small></span>
        </div>
        ${bkValide ? `<div class="mois-note">soit ${fmt(resteMensuel)} € restants sur le mois ÷ ${d.meta.semaines_restantes_mois} samedis</div>` : ""}
        ${p.spent_week != null ? (() => {
          const resteReel = p.budget_venir - p.spent_week;
          const overWeek = resteReel < 0;
          // Jauge de RESTANT : pleine et verte quand rien n'est dépensé, se vide à mesure.
          const pctReste = p.budget_venir > 0 ? Math.round(Math.max(0, resteReel) / p.budget_venir * 100) : 0;
          return `<div class="mois-note" style="color:${overWeek ? 'var(--red)' : 'var(--text2)'}">${fmt(p.spent_week)} € déjà dépensés cette semaine → reste réel <strong>${fmt(resteReel)} €</strong></div>
          ${lgauge(overWeek ? 100 : pctReste, overWeek ? 'var(--red)' : 'var(--green)')}
          <div class="pole-meta" style="margin-bottom:12px">
            <span style="color:${overWeek ? 'var(--red)' : 'var(--text3)'}">${overWeek ? `dépassé de ${fmt(Math.abs(resteReel))} €` : `${fmt(resteReel)} € restants sur ${fmt(p.budget_venir)} € cette semaine`}</span>
            <span style="color:${overWeek ? 'var(--red)' : 'var(--green)'};font-weight:500">${overWeek ? '0%' : pctReste + '%'}</span>
          </div>`;
        })() : ""}
        <div class="mois-note" style="color:var(--text3);opacity:.75">Bilan de la semaine passée :</div>
        ${lgauge(pctSemaine, over ? 'var(--red)' : p.color)}
        <div class="pole-meta">
          <span style="color:${over ? 'var(--red)' : 'var(--text3)'}">${fmt(p.spent_last)} € / ${fmt(p.base)} € la semaine passée${over ? ' — dépassé' : ''}</span>
          ${(!over && p.surplus > 0)
            ? `<span style="color:var(--green);font-weight:500">+${fmt(p.surplus)} € économisés</span>`
            : `<span style="color:${over ? 'var(--red)' : 'var(--green)'};font-weight:500">${pctSemaine}%</span>`}
        </div>
        ${bravoBanner(p)}
        ${absorptionBanner(p)}
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:12px;margin-bottom:2px">Cette semaine</div>
        ${txList(p.txs)}
        ${p.txs_mois && p.txs_mois.length ? `<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:12px;margin-bottom:2px">Tout le mois</div>${txList(p.txs_mois)}` : ""}
      </div>`;
    }).join("")}
    ${(d.libres || []).map(l => `<div class="row" style="display:flex;align-items:center;gap:10px">
      <div style="width:4px;height:24px;border-radius:2px;background:var(--text4)"></div>
      <div style="flex:1;font-size:13.5px;color:var(--text2)">${esc(l.name)} <span style="font-size:10.5px">· sans plafond</span></div>
      <div style="font-size:13px;color:var(--text3)">${fmt(l.spent)} €</div>
    </div>`).join("")}
  `;

  document.getElementById("app").innerHTML = html;
  requestAnimationFrame(() => document.getElementById("app").classList.add("mounted"));
}

render();
</script>
</body>
</html>
